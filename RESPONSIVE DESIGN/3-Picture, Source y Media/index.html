<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiquetas Picture, Source y Atributo Media</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <picture>
        <source srcset="dalto900.webp" type="image/webp">
        <source media="(max-width: 400px)" srcset="dalto360.png">
        <source media="(max-width: 600px)" srcset="dalto600.png">
        <img src="dalto900.png">
    </picture>
</body>

</html>
